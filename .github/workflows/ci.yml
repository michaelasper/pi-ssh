name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Provision local test utilities on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 fd-find ripgrep
          mkdir -p "$RUNNER_TEMP/pi-ssh-test-bin"
          ln -s "$(command -v fdfind)" "$RUNNER_TEMP/pi-ssh-test-bin/fd"
          echo "$RUNNER_TEMP/pi-ssh-test-bin" >> "$GITHUB_PATH"
      - name: Provision local test utilities on macOS
        if: runner.os == 'macOS'
        run: brew install fd ripgrep
      - run: npm run check
      - run: npm audit --audit-level=low
      - run: npm audit --omit=dev --audit-level=low
      - run: npm pack --dry-run
